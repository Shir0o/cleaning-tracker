name: PR Build

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'

# Use concurrency to cancel outdated builds automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Validation (Linux)
  # Cost: Lowest (1x)
  validation:
    name: "Validation & Builds (Linux)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run unit and widget tests
        run: |
          find test -name "*_test.dart" ! -name "*_golden_test.dart" | xargs flutter test --fail-fast

      - name: Build debug APK
        run: flutter build apk --debug

  # Job 2: Golden Tests (macOS)
  # Goldens are committed from macOS dev environments. Skia renders text
  # differently across platforms, so we run them on macOS to avoid
  # spurious sub-pixel diffs from Linux font rendering.
  golden-tests:
    name: "Golden Tests (macOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Golden Tests
        run: flutter test test/*_golden_test.dart --fail-fast

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  # Job 3: Integration Tests (Android Emulator on Linux)
  # Cost: Low (1x) - Significantly cheaper than macOS
  # ONLY runs on PRs and ONLY if previous checks pass.
  integration-tests:
    name: "Integration Tests (Android)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: validation # Fail-fast: ensure builds and tests pass first
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          # The script runs inside the emulator environment
          script: |
            flutter test integration_test/app_test.dart || exit 1
            flutter test integration_test/task_detail_page_integration_test.dart || exit 1
