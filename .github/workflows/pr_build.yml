name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/**'

# Use concurrency to cancel outdated builds automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Validation (Linux)
  # Cost: Lowest (1x)
  validation:
    name: "Validation & Builds (Linux)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap .env from template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run unit and widget tests
        run: |
          find test -name "*_test.dart" ! -name "*_golden_test.dart" | xargs flutter test --fail-fast

      - name: Build debug APK
        run: flutter build apk --debug

  # Job 2: Golden Tests (macOS)
  # Goldens are committed from macOS dev environments. Skia renders text
  # differently across platforms, so we run them on macOS to avoid
  # spurious sub-pixel diffs from Linux font rendering.
  golden-tests:
    name: "Golden Tests (macOS)"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap .env from template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run Golden Tests
        run: flutter test test/*_golden_test.dart --fail-fast

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  # Job 3: Integration Tests (Firebase Test Lab)
  # Runs the integration tests on a real-ish Android device hosted by
  # Firebase Test Lab instead of a self-hosted emulator. Auth uses
  # Workload Identity Federation — no long-lived service-account keys.
  integration-tests:
    name: "Integration Tests (Firebase Test Lab)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: validation
    timeout-minutes: 30
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap .env from template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Bootstrap Android project (generates gradlew)
        run: flutter build apk --debug

      - name: Build app APK with integration tests bundled
        run: |
          pushd android
          ./gradlew app:assembleDebug \
            -Ptarget=$(pwd)/../integration_test/all_tests.dart
          popd

      - name: Build instrumentation test APK
        run: |
          pushd android
          ./gradlew app:assembleAndroidTest
          popd

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run on Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app build/app/outputs/flutter-apk/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=33,locale=en,orientation=portrait \
            --timeout 10m \
            --results-bucket=cleaning-tracker-testlab-results \
            --results-dir=integration-tests/${{ github.run_id }}
