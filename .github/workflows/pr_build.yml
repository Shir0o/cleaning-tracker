name: PR Build

on:
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
  push:
    branches: [ "main", "master" ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'

# Use concurrency to cancel outdated builds automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Static Analysis and Unit Tests (Linux)
  # Cost: Lowest (1x)
  test-and-analyze:
    name: "Analyze & Unit Tests (Linux)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run unit and widget tests
        run: |
          find test -name "*_test.dart" ! -name "*_golden_test.dart" | xargs flutter test --fail-fast

  # Job 2: Golden Tests and Platform Builds (macOS)
  # Cost: High (10x) - Kept only for iOS-specific requirements
  macos-builds:
    name: "Golden Tests & Builds (macOS)"
    runs-on: macos-latest
    needs: test-and-analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Golden Tests
        run: flutter test test/*_golden_test.dart --fail-fast

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Build iOS
        run: flutter build ios --debug --no-codesign

  # Job 3: Integration Tests (Android Emulator on Linux)
  # Cost: Low (1x) - Significantly cheaper than macOS
  # ONLY runs on PRs and ONLY if previous checks pass.
  integration-tests:
    name: "Integration Tests (Android)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: macos-builds # Fail-fast: ensure builds and goldens pass first
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Integration Tests
        uses: reactive-circus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          # The script runs inside the emulator environment
          script: |
            flutter test integration_test/app_test.dart || exit 1
            flutter test integration_test/task_detail_page_integration_test.dart || exit 1
