name: cleaning_tracker
description: A Flutter app for tracking recurring household cleaning and maintenance tasks.
homepage: https://github.com/Shir0o/cleaning-tracker
repository: https://github.com/Shir0o/cleaning-tracker
issue_tracker: https://github.com/Shir0o/cleaning-tracker/issues
publish_to: none
version: 1.2.0
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.9
  permission_handler: ^12.0.1
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  timeago: ^3.7.1
  mockito: ^5.7.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  googleapis_auth: ^2.3.1
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  sqflite: ^2.4.1
  path: ^1.9.1
  flutter_dotenv: ^6.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  _discoveryapis_commons: ^1.0.7
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  network_image_mock: ^2.1.1
  http_mock_adapter: ^0.6.1
  golden_toolkit: ^0.15.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - .env
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
